[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "absensi-smpn1-pancarijang"
version = "0.1.0"
description = "Sistem Informasi Berbasis Digital UPT SMP Negeri 1 Pancarijang - absensi RFID"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.8.1",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "pyserial==3.5",
    "pyscard==2.2.1",
    "APScheduler==3.10.4",
    "pyqtgraph==0.13.7",
    "argon2-cffi==23.1.0",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "tzdata==2026.3; sys_platform == 'win32'",
    "openpyxl==3.1.5",
    "fpdf2==2.8.8",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pyinstaller==6.11.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
