# Lingkungan uji sementara (utang D-12, docs/PROGRES-DAN-UTANG.md §6.1).
# Runner GitHub berada di luar Indonesia: hanya data sintetis, tanpa rahasia produksi.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ejaan:
    name: Pemeriksa ejaan (typos)
    # PRD §24.7 P-31: salah ketik pada nama di kode dan teks. Daftar kata bahasa
    # Indonesia yang dianggap benar ada di _typos.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ambil kode
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Periksa ejaan
        uses: crate-ci/typos@v1.52.2

  build-dan-tes:
    name: Build dan seluruh tes (Windows)
    # WPF (net10.0-windows) hanya dapat dibangun dan diuji penuh di Windows.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Ambil kode
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pasang .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Absensi.sln

      - name: Build Release
        run: dotnet build Absensi.sln -c Release --no-restore

      # Tes tata letak WPF membuka jendela sungguhan berukuran 1366x768 (PRD/Panduan UI:
      # layar minimal 1366x768). Layar bawaan runner lebih kecil, jadi diperbesar dulu.
      - name: Perbesar resolusi layar runner
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Tes
        run: >
          dotnet test Absensi.sln -c Release --no-build
          --logger "trx" --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Simpan hasil tes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-tes
          path: TestResults
          retention-days: 7

      - name: Buat paket uji Windows x64
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 12)
          $folder = Join-Path $env:RUNNER_TEMP 'absensi-win-x64'
          $output = Join-Path $env:RUNNER_TEMP 'paket-uji'
          New-Item -ItemType Directory -Path $output | Out-Null
          dotnet publish src/Absensi.App/Absensi.App.csproj -c Release -r win-x64 --self-contained -o $folder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Commit=$env:GITHUB_SHA", 'Target=win-x64', "Workflow=$env:GITHUB_RUN_ID" | Set-Content (Join-Path $folder 'BUILD.txt')
          $zip = Join-Path $output "AbsensiSekolah-uji-$short-win-x64.zip"
          Compress-Archive -Path "$folder/*" -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content "$zip.sha256"

      - name: Simpan paket uji Windows x64
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AbsensiSekolah-uji-win-x64-${{ github.sha }}
          path: ${{ runner.temp }}/paket-uji/
          if-no-files-found: error
          retention-days: 30
