# Lingkungan uji sementara (utang D-12, docs/PROGRES-DAN-UTANG.md §6.1).
# Runner GitHub berada di luar Indonesia: hanya data sintetis, tanpa rahasia produksi.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dan-tes:
    name: Build dan seluruh tes (Windows)
    # WPF (net8.0-windows) hanya dapat dibangun dan diuji penuh di Windows.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pasang .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Absensi.sln

      - name: Build Release
        run: dotnet build Absensi.sln -c Release --no-restore

      # Tes tata letak WPF membuka jendela sungguhan berukuran 1366x768 (PRD/Panduan UI:
      # layar minimal 1366x768). Layar bawaan runner lebih kecil, jadi diperbesar dulu.
      - name: Perbesar resolusi layar runner
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Tes
        run: >
          dotnet test Absensi.sln -c Release --no-build
          --logger "trx" --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Simpan hasil tes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-tes
          path: TestResults
          retention-days: 7
