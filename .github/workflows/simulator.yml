# Build simulator browser (Blazor WebAssembly) dari master dan simpan hasil
# publish ke cabang simulator-build sebagai berkas statis. Hanya data contoh
# (utang D-12); tidak ada database, rahasia, atau data siswa.
name: Simulator browser

on:
  push:
    branches: [master]
    paths:
      - 'src/Absensi.Domain/**'
      - 'src/Absensi.Simulator.Core/**'
      - 'src/Absensi.Simulator.Web/**'
      - '.github/workflows/simulator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simulator-build
  cancel-in-progress: true

jobs:
  publish:
    name: Publish simulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Tes logika simulator
        run: dotnet test tests/Absensi.Simulator.Core.Tests -c Release

      - name: Publish Blazor WebAssembly
        run: dotnet publish src/Absensi.Simulator.Web/Absensi.Simulator.Web.csproj -c Release -o publish

      - name: Simpan ke cabang simulator-build
        run: |
          cd publish/wwwroot
          touch .nojekyll
          git init -q -b simulator-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build simulator dari ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" simulator-build
