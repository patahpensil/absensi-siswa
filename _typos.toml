# Pemeriksa ejaan otomatis (PRD §24.7 P-31). typos mencari salah ketik bahasa
# Inggris pada nama di kode dan teks. Kata bahasa Indonesia yang kebetulan mirip
# salah ketik bahasa Inggris didaftarkan di bawah sebagai kata yang benar.
[files]
extend-exclude = ["arsip/"]

[default]
# Hash commit (mis. "commit ba68604") bukan kata.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

